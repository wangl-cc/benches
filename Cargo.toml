[workspace]
resolver = "3"
members = [
  "crates/harness",
  "crates/bench_hash",
  "crates/bench_prng",
]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
blake2 = "0.10"
blake3 = "1.5"
clap = "4.5"
digest = "0.10.7"
gxhash = "3"
rand = "0.10"
rand_pcg = "0.10"
rand_xoshiro = "0.8"
rapidhash = "4"
serde = "1"
serde_json = "1"
sha2 = { version = "0.10", features = ["asm"] }
time = { version = "0.3", features = ["formatting"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.bench]
lto = "fat"
codegen-units = 1
